name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - name: staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest -checks "all,-ST1000,-ST1003,-ST1016,-ST1020,-ST1021,-ST1022,-ST1013,-SA1019,-S1007" ./...
      - run: make term
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh -n install.sh && sh -n uninstall.sh
      - name: Build a snapshot and install it
        run: |
          scripts/release.sh v0.0.0-ci dist
          (cd dist && sha256sum -c SHA256SUMS)
          MENO_BASE_URL="file://$PWD/dist" MENO_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/meno" --version
